name: Ansible Lint
on:
  push:
  pull_request:
    paths:
      - playbooks/**.yaml
jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checks-out the repository under $GITHUB_WORKSPACE
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ansible-lint
        run: python3 -m pip install ansible-dev-tools --user

      - name: Install dependency
        run: ansible-galaxy collection install -r requirements.yaml
        # run: ansible-galaxy collection install -r requirements.yaml -p ./.ansible/collections

      - name: Prepare redhat-subscription
        run: |
          git clone --depth 1 --branch 1.3.0 https://opendev.org/openstack/ansible-role-redhat-subscription.git $HOME/.ansible/roles/redhat-subscription
          find $HOME/.ansible/roles/redhat-subscription
          find / -wholename "*site-packages/ansible/playbook/role/__init__.py"

      - name: Run lint
        run: ansible-lint playbooks/**
        # run: export ANSIBLE_COLLECTIONS_PATH=$HOME/.ansible/collections; ansible-lint playbooks/**
